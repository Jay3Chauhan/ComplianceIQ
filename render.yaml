services:
  - type: web
    name: complianceiq-api
    runtime: docker
    plan: standard
    healthCheckPath: /api/v1/health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: QDRANT_COLLECTION
        value: regulations_v2
      - key: API_KEYS
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: APP_ENV
        value: production
      # Render disks are the simplest way to keep SQLite across deploys;
      # otherwise point this at a managed Postgres.
      - key: DATABASE_URL
        value: sqlite:////var/data/complianceiq.db
    disk:
      name: complianceiq-data
      mountPath: /var/data
      sizeGB: 1
